name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Inspect repository structure
        run: |
          echo "=== Root files ==="
          ls -la
          echo "=== Android directory ==="
          ls -la android || true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y scons pkg-config libasound2-dev libpulse-dev

      - name: Build
        run: |
          scons target=android mode=release
