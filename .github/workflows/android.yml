name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Find Android build scripts
        run: |
          echo "=== Поиск файлов сборки Android ==="
          find . -maxdepth 3 -iname "*android*" -o -iname "*gradle*"
